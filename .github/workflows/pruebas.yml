name: Pruebas

# En cada subida a main: pruebas sin red y límites de tamaño. No usa ningún secreto.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/check_size.py
      - run: python -m unittest discover -s tests
